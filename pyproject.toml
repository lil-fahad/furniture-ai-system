[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "furniture-ai-system"
version = "1.2.0"
description = "A single secure monorepo for floor-plan analysis, furniture layout, AI design guidance, catalog, and bookings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "openai>=1.60,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10,<13",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "scikit-learn>=1.5,<2",
  "shapely>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2", "requests>=2.32,<3"]
vision = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0,<2"]
professional = [
  "safetensors>=0.4,<1",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.57,<6",
]
training = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0,<2", "tqdm>=4.66,<5"]
supplier-training = ["scikit-learn>=1.5,<2"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
furniture-ai = "furniture_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["models", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
