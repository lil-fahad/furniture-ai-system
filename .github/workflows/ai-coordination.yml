name: ai-coordination

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-coordination-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-conflict-guard:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Check live multi-agent overlap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/ai_coordination.py check-pr
          --repo "$GITHUB_REPOSITORY"
          --pr "${{ github.event.pull_request.number }}"

  publish-main-update:
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Publish latest main state to coordination board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/ai_coordination.py notify-main
          --repo "$GITHUB_REPOSITORY"
          --issue 66
