name: ai-coordination

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-coordination-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-conflict-guard:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted coordination policy and project manifest source from main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Enforce bootstrap, current-main, scope, and bilateral collaboration policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/ai_coordination.py check-pr
          --repo "$GITHUB_REPOSITORY"
          --pr "${{ github.event.pull_request.number }}"
      - name: Enforce active leases even before peer PR creation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/ai_lease_conflict_guard.py
          --repo "$GITHUB_REPOSITORY"
          --pr "${{ github.event.pull_request.number }}"

  publish-main-update:
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Publish latest main and active-session census to coordination board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/ai_coordination.py notify-main
          --repo "$GITHUB_REPOSITORY"
          --issue 66
