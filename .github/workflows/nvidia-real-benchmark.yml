name: nvidia-real-benchmark

on:
  workflow_dispatch:
    inputs:
      model_dir:
        description: Absolute path to the pinned local Hugging Face model directory
        required: true
        type: string
      ground_truth:
        description: Absolute path to FurnitureAI Open Images ground-truth JSONL
        required: true
        type: string
      images_dir:
        description: Absolute path containing Open Images validation JPG files by image ID
        required: true
        type: string
      model_id:
        description: Pinned model identifier
        required: true
        default: chosungbeen/furniture_use_data_partial_finetuning
        type: string
      model_revision:
        description: Pinned Hugging Face revision
        required: true
        default: 379f0882b2a66b50204f83921fe750dc483d0f4c
        type: string
      model_sha256:
        description: Expected SHA-256 of model.safetensors
        required: true
        default: 292c5f45918c4275d9c0dc6777a2f6fc656e50f87684e2aecd045929accc76b1
        type: string
      precision:
        description: CUDA inference precision
        required: true
        default: auto
        type: choice
        options:
          - auto
          - fp32
          - fp16
          - bf16
      threshold:
        description: Prediction score threshold used before AP evaluation
        required: true
        default: "0.05"
        type: string

permissions:
  contents: read

concurrency:
  group: nvidia-real-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64, nvidia]
    timeout-minutes: 120
    env:
      MODEL_DIR: ${{ inputs.model_dir }}
      GROUND_TRUTH: ${{ inputs.ground_truth }}
      IMAGES_DIR: ${{ inputs.images_dir }}
      MODEL_ID: ${{ inputs.model_id }}
      MODEL_REVISION: ${{ inputs.model_revision }}
      MODEL_SHA256: ${{ inputs.model_sha256 }}
      PRECISION: ${{ inputs.precision }}
      THRESHOLD: ${{ inputs.threshold }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install professional inference dependencies
        run: python -m pip install -e ".[professional]"

      - name: Record NVIDIA host evidence
        run: |
          mkdir -p benchmark-results
          nvidia-smi > benchmark-results/nvidia-smi.txt
          python - <<'PY' > benchmark-results/torch-runtime.json
          import json
          import torch
          print(json.dumps({
              "torch_version": torch.__version__,
              "cuda_runtime": torch.version.cuda,
              "cuda_available": torch.cuda.is_available(),
              "cudnn_version": torch.backends.cudnn.version(),
          }, indent=2, sort_keys=True))
          PY
          python scripts/nvidia_runtime_probe.py \
            --device cuda \
            --precision "$PRECISION" \
            > benchmark-results/nvidia-runtime.json

      - name: Generate pinned real-data predictions
        run: |
          python scripts/predict_openimages_furniture.py \
            --model-dir "$MODEL_DIR" \
            --model-id "$MODEL_ID" \
            --model-revision "$MODEL_REVISION" \
            --model-sha256 "$MODEL_SHA256" \
            --ground-truth "$GROUND_TRUTH" \
            --images-dir "$IMAGES_DIR" \
            --output benchmark-results/predictions.jsonl \
            --metadata benchmark-results/predictions.metadata.json \
            --device cuda \
            --precision "$PRECISION" \
            --threshold "$THRESHOLD"

      - name: Evaluate predictions against pinned ground truth
        run: |
          python scripts/evaluate_detection_predictions.py \
            --ground-truth "$GROUND_TRUTH" \
            --predictions benchmark-results/predictions.jsonl \
            --output benchmark-results/evaluation.json \
            --model-id "$MODEL_ID" \
            --model-revision "$MODEL_REVISION" \
            --model-sha256 "$MODEL_SHA256"

      - name: Publish benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nvidia-openimages-benchmark-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
