name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,training]"
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall src training tests scripts
      - name: Validate professional model metadata
        run: |
          python scripts/install_professional_bundle.py --check-spec
          python scripts/model_manifest.py
      - name: Test
        run: pytest --cov=furniture_ai --cov-report=term-missing
      - name: Verify secret wiring without disclosure
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          from furniture_ai.config import get_settings
          assert get_settings().openai_configured is True
          print("OPENAI_API_KEY is configured")
          PY
      - name: Secret scan
        run: python scripts/scan_secrets.py
      - name: Repository audit
        run: python scripts/repository_audit.py
