name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}/src

defaults:
  run:
    shell: bash

jobs:
  runtime-quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit
      - name: Runtime dependency security audit
        run: |
          python -m pip freeze | grep -v '^furniture-ai-system==' > /tmp/requirements-audit.txt
          pip-audit --strict -r /tmp/requirements-audit.txt
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall src training tests scripts
      - name: Validate professional model metadata
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          python scripts/install_professional_bundle.py --check-spec
          python scripts/model_manifest.py
      - name: Test runtime without heavyweight training stack
        run: |
          pytest --cov=furniture_ai --cov-report=term-missing \
            --ignore=tests/test_hf_foundation_models.py \
            --ignore=tests/test_nvidia_acceleration.py \
            --ignore=tests/test_training_smoke.py \
            --ignore=tests/test_style_dataset_pipeline.py \
            --ignore=tests/test_train_floorplan_segmenter.py
      - name: Smoke-test standalone wheel resources
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          rm -rf /tmp/furniture-wheel /tmp/furniture-wheel-target build
          mkdir -p /tmp/furniture-wheel /tmp/furniture-wheel-target
          python -m pip wheel --no-deps --wheel-dir /tmp/furniture-wheel .
          python -m pip install --no-deps \
            --target /tmp/furniture-wheel-target /tmp/furniture-wheel/*.whl
          (
            cd /tmp
            PYTHONPATH=/tmp/furniture-wheel-target python - <<'PY'
          from furniture_ai.config import Settings
          from furniture_ai.layout import load_catalog
          from furniture_ai.models import ModelRegistry

          settings = Settings(environment="test")
          catalog = load_catalog()
          registry = ModelRegistry(
              settings.model_manifest_path,
              allow_packaged_default=not settings.model_manifest_path_overridden,
          )
          statuses = registry.statuses()
          assert catalog and catalog[0].id == "sofa-3-seat"
          assert len(statuses) == 8
          print("standalone wheel runtime resources verified")
          PY
          )
          rm -rf build
          test ! -e build
      - name: Verify OpenAI secret wiring without disclosure
        if: ${{ matrix.python-version == '3.12' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "OPENAI_API_KEY is not configured; skipping optional wiring check"
            exit 0
          fi
          python - <<'PY'
          from furniture_ai.config import get_settings
          assert get_settings().openai_configured is True
          print("OPENAI_API_KEY is configured")
          PY
      - name: Secret scan
        if: ${{ matrix.python-version == '3.12' }}
        run: python scripts/scan_secrets.py
      - name: Repository audit
        if: ${{ matrix.python-version == '3.12' }}
        run: python scripts/repository_audit.py

  training-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime, development, and training dependencies
        run: python -m pip install -e ".[dev,training]"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit
      - name: Full dependency security audit
        run: |
          python -m pip freeze | grep -v '^furniture-ai-system==' > /tmp/requirements-audit.txt
          pip-audit --strict -r /tmp/requirements-audit.txt
      - name: Verify training stack imports
        run: |
          python - <<'PY'
          import timm
          import torch
          import torchvision

          print("training stack verified", torch.__version__, torchvision.__version__, timm.__version__)
          PY
      - name: Run complete test suite with training dependencies
        run: pytest --cov=furniture_ai --cov-report=term-missing
