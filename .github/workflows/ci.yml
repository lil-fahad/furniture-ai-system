name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Dependency security audit
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit --strict --skip-editable
      - name: Install training dependencies
        run: python -m pip install -e ".[training]"
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall src training tests scripts
      - name: Validate professional model metadata
        run: |
          python scripts/install_professional_bundle.py --check-spec
          python scripts/model_manifest.py
      - name: Runtime smoke
        run: python scripts/runtime_smoke.py
      - name: Test
        run: pytest --cov=furniture_ai --cov-report=term-missing
      - name: Verify secret wiring without disclosure
        if: env.OPENAI_API_KEY != ''
        run: |
          python - <<'PY'
          from furniture_ai.config import get_settings
          assert get_settings().openai_configured is True
          print("OPENAI_API_KEY is configured")
          PY
      - name: Secret scan
        run: python scripts/scan_secrets.py
      - name: Repository audit
        run: python scripts/repository_audit.py
