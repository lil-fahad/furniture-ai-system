name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Validate locked sources
        run: |
          python - <<'PY'
          from furniture_system.registry import SourceRegistry
          registry = SourceRegistry.load("sources.lock.json")
          summary = registry.summary()
          assert summary["importable_sources"] == 9
          assert summary["blocked_sources"] == 1
          print(summary)
          PY
