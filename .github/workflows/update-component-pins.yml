name: Update merged component pins

on:
  push:
    branches: [develop/platform-v0.2]
    paths:
      - .github/workflows/update-component-pins.yml

permissions:
  contents: write

jobs:
  update-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/platform-v0.2
          fetch-depth: 0
      - name: Update lock registry and gitlinks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          updates = {
              "classification-suite": "06199f5d3515d623aa2493efa3088481c3265406",
              "floorplan-engine": "193d1f464caf60f552905cb62045a74b0ee5b5dc",
              "vision-prototypes": "b43a2bef08a9f70bfaf189f9a6893fd14d7447c7",
          }
          path = Path("sources.lock.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          for source in payload["sources"]:
              if source["id"] in updates:
                  source["commit"] = updates[source["id"]]
          payload["generated_at"] = "2026-08-02T14:30:00+03:00"
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

          git update-index --add --cacheinfo 160000,06199f5d3515d623aa2493efa3088481c3265406,components/furniture_ai_suite
          git update-index --add --cacheinfo 160000,193d1f464caf60f552905cb62045a74b0ee5b5dc,components/floorplan_furnisher_pro
          git update-index --add --cacheinfo 160000,b43a2bef08a9f70bfaf189f9a6893fd14d7447c7,components/furniture_designer_ai

          git rm .github/workflows/update-component-pins.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.lock.json
          git commit -m "chore: pin merged v2 furniture components"
          git push origin HEAD:develop/platform-v0.2
