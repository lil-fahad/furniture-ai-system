services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      SERVICE_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      DATABASE_PATH: /data/furniture_ai.sqlite3
    volumes:
      - furniture-data:/data

volumes:
  furniture-data:
